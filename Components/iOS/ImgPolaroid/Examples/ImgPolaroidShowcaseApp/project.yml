name: ImgPolaroidShowcaseApp
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: '17.0'
packages:
  ImgPolaroid:
    path: ../..
targets:
  ImgPolaroidShowcaseApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../ImgPolaroidShowcase.swift
    dependencies:
      - package: ImgPolaroid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.img-polaroid-showcase
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
