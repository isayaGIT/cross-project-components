name: AvatarShowcaseApp
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: '17.0'
packages:
  Avatar:
    path: ../..
targets:
  AvatarShowcaseApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../AvatarShowcase.swift
    dependencies:
      - package: Avatar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.avatar-showcase
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
