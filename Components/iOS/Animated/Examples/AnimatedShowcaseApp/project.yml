name: AnimatedShowcaseApp
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: '17.0'
packages:
  Animated:
    path: ../..
targets:
  AnimatedShowcaseApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Sources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Animated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.animated-showcase
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
