name: LLMRoutesDemo
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: "17.0"
packages:
  ScreenMiniature:
    path: ../../ScreenMiniature
targets:
  LLMRoutesDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.llmroutesdemo
        PRODUCT_NAME: LLMRoutesDemo
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    dependencies:
      - package: ScreenMiniature
        product: ScreenMiniature
schemes:
  LLMRoutesDemo:
    build:
      targets:
        LLMRoutesDemo: all
    run:
      config: Debug
