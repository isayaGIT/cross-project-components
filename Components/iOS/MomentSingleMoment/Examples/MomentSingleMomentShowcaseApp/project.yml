name: MomentSingleMomentShowcaseApp
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: "17.0"
packages:
  CrossProjectComponents:
    path: ../../../../..
targets:
  MomentSingleMomentShowcaseApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: CrossProjectComponents
        product: CrossProjectComponentsIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.MomentSingleMomentShowcaseApp
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
