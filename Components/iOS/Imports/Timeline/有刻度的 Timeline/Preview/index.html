<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticked Timeline — Component Preview</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#181a1c;--text:#f0f0ed;--muted:#73777b;--line:#34383c;--hot:#f2e8d2;--glow:#e3c98f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#292b2c 0%,var(--bg) 58%);color:var(--text);display:grid;place-items:center;padding:28px}.shell{width:min(780px,100%)}.eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.18em;color:#9a9d9e;text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:center;margin:0 0 24px}.pill{font-size:11px;color:#a9abad;border:1px solid #3c4042;border-radius:99px;padding:7px 10px}.panel{border:1px solid #303335;background:linear-gradient(145deg,#202224ee,#141617f5);border-radius:18px;padding:25px 22px 22px;box-shadow:0 24px 70px #0008}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.section-head h1{font-size:clamp(21px,4vw,30px);font-weight:520;letter-spacing:-.045em;margin:7px 0 5px}.section-head p{color:#898d8f;font-size:12px;margin:0}.date-display{text-align:right;min-width:110px}.date-display strong{display:block;font-size:19px;font-weight:500;letter-spacing:-.04em}.date-display span{display:block;color:#8c9092;font-size:11px;margin-top:4px}.timeline-area{margin-top:35px;position:relative;padding-top:43px}.selected{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:12px;color:#e6e0d2;white-space:nowrap;background:#292a27;border:1px solid #565146;border-radius:7px;padding:7px 10px;box-shadow:0 4px 20px #0005}.selected:after{content:"";position:absolute;left:50%;bottom:-5px;width:7px;height:7px;transform:translateX(-50%) rotate(45deg);background:#292a27;border-right:1px solid #565146;border-bottom:1px solid #565146}.ruler{height:86px;position:relative;overflow:hidden;touch-action:pan-y;cursor:ew-resize;user-select:none;outline:none;border-top:1px solid #35383a;border-bottom:1px solid #242729}.ruler:focus-visible{box-shadow:0 0 0 2px #b7aa8c66}.ticks{position:absolute;inset:0;will-change:transform}.tick{position:absolute;top:0;width:1px;height:19px;background:#606467;transform:translateX(-50%);opacity:.56}.tick.major{height:30px;background:#9c9f9f;opacity:.9}.tick.current{background:var(--hot);width:2px;height:42px;opacity:1;box-shadow:0 0 12px #e3c98f55}.label{position:absolute;top:35px;transform:translateX(-50%);font-size:10px;color:#717679;white-space:nowrap;letter-spacing:.02em}.label.month{color:#d4d0c5;font-size:11px;font-weight:600;letter-spacing:.08em}.centerline{position:absolute;left:50%;top:0;height:100%;width:1px;background:#e3c98f66;pointer-events:none}.center-dot{position:absolute;top:40px;left:50%;width:5px;height:5px;border-radius:50%;background:#f1e7d1;transform:translateX(-50%);box-shadow:0 0 12px #e3c98f99}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#7e8284;font-size:11px}.footer kbd{font:inherit;border:1px solid #44484a;padding:4px 7px;border-radius:5px;color:#bfc1be}.instruction{display:flex;gap:8px;align-items:center}.dot{width:5px;height:5px;border-radius:50%;background:#b7a987;box-shadow:0 0 8px #b7a98788}@media(max-width:520px){body{padding:16px}.panel{padding:20px 15px}.section-head{flex-direction:column}.date-display{text-align:left}.timeline-area{margin-top:28px}.footer{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head>
<body><main class="shell"><header class="head"><div class="eyebrow">Interaction study / 01</div><div class="pill">LOCAL COMPONENT PREVIEW</div></header><section class="panel"><div class="section-head"><div><div class="eyebrow">CONTINUOUS TIME STRIP</div><h1>Ticked Timeline</h1><p>Drag the ruler to browse days · tap to jump · use arrow keys</p></div><div class="date-display"><strong id="date">OCT 26</strong><span id="weekday">MONDAY · 2026</span></div></div><div class="timeline-area"><div class="selected" id="selection">Today</div><div class="ruler" id="ruler" tabindex="0" role="slider" aria-label="Timeline" aria-valuemin="1" aria-valuemax="61" aria-valuenow="31"><div class="ticks" id="ticks"></div><div class="centerline"></div><div class="center-dot"></div></div></div><div class="footer"><div class="instruction"><span class="dot"></span><span id="status">61 days · centered selection</span></div><div><kbd>←</kbd> <kbd>→</kbd> move one day</div></div></section></main>
<script>
(()=>{const ruler=document.querySelector('#ruler'),ticks=document.querySelector('#ticks'),dateOut=document.querySelector('#date'),weekdayOut=document.querySelector('#weekday'),selection=document.querySelector('#selection'),status=document.querySelector('#status');const today=new Date(2026,9,26);const days=Array.from({length:61},(_,i)=>{let d=new Date(today);d.setDate(today.getDate()+i-30);return d});let index=30,dragging=false,startX=0,startIndex=0;const month=d=>d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();function render(){ticks.replaceChildren();const width=ruler.clientWidth,step=18,center=width/2;days.forEach((d,i)=>{let x=center+(i-index)*step;if(x < -step||x>width+step)return;let tick=document.createElement('i');tick.className='tick'+(d.getDate()===1?' major':'')+(i===index?' current':'');tick.style.left=x+'px';ticks.append(tick);if(d.getDate()===1||i===index||d.getDate()===15){let l=document.createElement('span');l.className='label'+(d.getDate()===1?' month':'');l.textContent=d.getDate()===1?month(d):String(d.getDate());l.style.left=x+'px';ticks.append(l)}});let d=days[index];dateOut.textContent=month(d)+' '+d.getDate();weekdayOut.textContent=d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()+' · '+d.getFullYear();selection.textContent=d.toDateString()===today.toDateString()?'Today':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});ruler.setAttribute('aria-valuenow',index+1);ruler.setAttribute('aria-valuetext',d.toDateString());status.textContent=(index+1)+' / '+days.length+' days · selected date';}function move(n){index=Math.max(0,Math.min(days.length-1,n));render()}ruler.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startIndex=index;ruler.setPointerCapture(e.pointerId)});ruler.addEventListener('pointermove',e=>{if(!dragging)return;move(startIndex-Math.round((e.clientX-startX)/18))});ruler.addEventListener('pointerup',()=>dragging=false);ruler.addEventListener('pointercancel',()=>dragging=false);ruler.addEventListener('click',e=>{if(Math.abs(e.clientX-startX)>5)return;move(index-Math.round((e.clientX-ruler.getBoundingClientRect().left-ruler.clientWidth/2)/18))});ruler.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown')move(index-1);else if(e.key==='ArrowRight'||e.key==='ArrowUp')move(index+1);else if(e.key==='Home')move(0);else if(e.key==='End')move(days.length-1);else return;e.preventDefault()});new ResizeObserver(render).observe(ruler);render()})();
</script></body></html>
