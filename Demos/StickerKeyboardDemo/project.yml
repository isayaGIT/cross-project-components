name: StickerKeyboardDemo
options:
  bundleIdPrefix: dev.crossprojectcomponents
  deploymentTarget:
    iOS: "17.0"
packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 13.0.0
  Animated:
    path: ../../Components/iOS/Animated
  BottomSheet:
    path: ../../Components/iOS/Trivial/BottomSheet
  LineDashed:
    path: ../../Shapes/LineDashed
targets:
  StickerData:
    type: framework
    platform: iOS
    sources:
      - path: ../../Class/Sticker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.stickerdata.demo
        PRODUCT_NAME: StickerData
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: 5.0
  StickerKeyboardDemo:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../Components/iOS/ScreenChatContainer/ScreenChat/InputContainer/StickerKeyboard/StickerKeyboard.swift
      - path: ../../Components/iOS/ScreenChatContainer/ScreenChat/InputContainer/StickerKeyboard/StickerSearchSheet.swift
      - path: ../../Components/iOS/Trivial/BottomSheet/BottomSheetPresentation.swift
      - path: ../../Components/iOS/MotionConfigProtocols/MotionConfigProtocol.swift
      - path: ../../Components/iOS/MotionConfigProtocols/BottomSheetMotionConfigProtocol.swift
      - path: ../../Components/iOS/MotionConfigProtocols/BottomSheetMotionConfig.swift
      - path: ../../Components/iOS/Trivial/Capsules/CapsuleButton.swift
      - path: ../../Components/iOS/Trivial/DashedPath/DashedPath.swift
      - path: ../../Components/iOS/MessageBubble/RoundedRectSmoothed.swift
      - path: ../../Shapes/RoundedRectSmoothed/BubbleBottomRight.swift
      - path: ../../Components/iOS/Trivial/ContainerStyle/ContainerStyle.swift
      - path: ../../Components/iOS/Trivial/TextFieldCustom/TextFieldCustom.swift
      - path: ../../Class/Background/Background.swift
      - path: ../../Class/Background/ColorCustom.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossprojectcomponents.stickerkeyboarddemo
        PRODUCT_NAME: StickerKeyboardDemo
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
    dependencies:
      - target: StickerData
      - package: Nuke
        product: NukeUI
      - package: Animated
        product: Animated
      - package: BottomSheet
        product: BottomSheet
      - package: LineDashed
        product: LineDashed
schemes:
  StickerKeyboardDemo:
    build:
      targets:
        StickerKeyboardDemo: all
    run:
      config: Debug
