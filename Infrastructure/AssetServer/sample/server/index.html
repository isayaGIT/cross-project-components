<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Asset Manager</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26232a;background:#faf9fb;--muted:#89838e;--line:#e9e5eb;--accent:#b95680;--soft:#f8eaf1;--surface:#fff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#29262d;color:#fff;font-size:13px}button:disabled{opacity:.5;cursor:default}.secondary{background:#fff;color:#37323a;border:1px solid var(--line)}.shell{max-width:1200px;margin:auto;padding:30px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px}.mark{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:18px}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.controls{display:flex;gap:8px;align-items:center}.version,.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;font-size:13px}.version{width:100px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px}.filters{display:flex;gap:6px;flex:1;flex-wrap:wrap}.filter{background:transparent;color:#77717d;border:1px solid transparent;padding:8px 12px}.filter[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#f0d7e2}.search{width:240px;max-width:45%}.upload{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px dashed #d9cbd3;border-radius:12px;padding:15px 17px;margin-bottom:16px}.upload-heading{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.upload strong{font-size:13px;white-space:nowrap}.upload p{display:none}.upload form{display:flex;gap:10px;align-items:center}.upload-actions{display:flex;align-items:center;gap:8px}.upload .info-button{width:28px;height:28px;flex:0 0 28px;font-size:13px}.info-button{width:34px;height:34px;padding:0;border-radius:50%;font-weight:700;font-size:15px}.guide{position:fixed;inset:0;background:#211b2480;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.guide.open{display:flex}.guide-panel{background:#fff;border-radius:18px;width:min(1080px,100%);height:min(780px,90vh);max-height:90vh;overflow:hidden;padding:0;box-shadow:0 24px 80px #160d1d35;display:flex;flex-direction:column}.guide-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;background:#fff;border-bottom:1px solid var(--line)}.guide-layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0;flex:1}.guide-nav{padding:20px 12px;border-right:1px solid var(--line);background:#fcfbfc;overflow:auto}.guide-nav-label{padding:0 10px 10px;font-size:10px;font-weight:700;letter-spacing:1px;color:#a19aa4}.guide-nav button{display:block;width:100%;text-align:left;background:transparent;color:#635b66;font-size:13px;line-height:1.45;padding:10px;border-radius:8px;margin:2px 0}.guide-nav button:hover{background:#f4edf2}.guide-nav button.active{background:#f8e7f0;color:#8f365f;font-weight:600}.guide-nav button .nav-file{display:block;font-size:11px;font-weight:400;color:#938895;margin-top:4px;overflow-wrap:anywhere}.guide-main{overflow:auto;min-width:0;scroll-behavior:smooth}.guide-main #guide-content{padding:0 0 22px}.guide-section[id]{scroll-margin-top:12px}.guide-head h2{font-size:20px;letter-spacing:-.3px;margin:0}.guide-head .secondary{flex-shrink:0}.guide-section{margin:0 28px;padding:22px 0;border-bottom:1px solid var(--line)}.guide-section:last-child{border-bottom:0}.guide-section h3{font-size:15px;line-height:1.4;margin:0 0 10px;color:#302a33;background:linear-gradient(transparent 44%,#fff0a8 44%,#fff0a8 95%,transparent 95%);width:fit-content;max-width:100%;padding:0 5px 2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}.guide-section p,.guide-section li{font-size:14px;line-height:1.8;color:#625b66}.guide-section p{margin:8px 0}.guide-section ul{padding-left:22px;margin:10px 0}.guide-section li{padding:3px 0}.guide-section code{font-size:12px;background:#f5f0f4;color:#8d3c61;padding:3px 6px;border-radius:5px;overflow-wrap:anywhere}.guide-section h3+ p{margin-top:0}.guide-field{padding:13px 14px;border:1px solid #eee8ee;border-radius:10px;background:#fdfcfd;min-width:0}.guide-field strong{display:block;font-size:13px;line-height:1.6;color:#332d36;overflow-wrap:anywhere}.guide-field strong code{margin-left:4px;font-weight:500}.guide-field p{font-size:13px;line-height:1.65;margin:6px 0 0;overflow-wrap:anywhere}.guide-section:has(.guide-field) > .guide-field{display:grid;grid-template-columns:minmax(150px,.7fr) minmax(0,1.3fr);gap:12px;align-items:start}.guide-nested{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid #eee8ee}.guide-nested .guide-field{background:#fff}.guide-section > .guide-field{margin-top:8px}.guide-section > p.meta{font-size:13px;color:var(--muted)}@media(max-width:700px){.guide{padding:8px}.guide-panel{height:94vh;max-height:94vh;border-radius:14px}.guide-head{padding:15px 17px}.guide-head h2{font-size:17px}.guide-layout{grid-template-columns:132px minmax(0,1fr)}.guide-nav{padding:14px 7px}.guide-nav button{font-size:12px;padding:9px 7px}.guide-nav button .nav-file{font-size:10px}.guide-section{margin:0 16px;padding:18px 0}.guide-section:has(.guide-field) > .guide-field{grid-template-columns:1fr;gap:4px}.guide-nested{grid-template-columns:1fr}.guide-section p,.guide-section li{font-size:13px}}.file{max-width:270px;font-size:12px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);min-height:17px;margin:0 0 14px}.notice.error{color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.material{border:1px solid var(--line);background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;min-width:0;text-align:left;color:inherit;padding:0}.material:hover{border-color:#d9b7c8;transform:translateY(-1px)}.preview{height:150px;background:#f1eef2;display:grid;place-items:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:contain}.kind{color:#837987;font-size:12px;background:#e9e5ec;border-radius:7px;padding:8px}.info{padding:12px}.name{font-size:13px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin:0;overflow-wrap:anywhere}.empty{grid-column:1/-1;padding:55px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:13px}.detail{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;display:none}.detail.open{display:block}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.detail h2{font-size:17px;margin:0}.detail h3{font-size:13px;margin:20px 0 8px}.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.file-row a{color:var(--accent);text-decoration:none}.file-row small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.json{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;background:#f8f7f9;padding:12px;border-radius:8px;overflow:auto;max-height:360px;white-space:pre}.foot{font-size:11px;color:#aaa4af;margin-top:25px;border-top:1px solid var(--line);padding-top:13px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:18px 14px 40px}.top{align-items:flex-start}.controls{flex-wrap:wrap;justify-content:flex-end}.toolbar{flex-direction:column;align-items:stretch}.search{width:100%;max-width:none}.upload{align-items:center;flex-direction:row;flex-wrap:wrap}.upload-heading{flex:1 1 auto}.upload form{width:auto;flex:0 1 auto;flex-wrap:wrap}.file{max-width:100%;width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.preview{height:125px}.info{padding:10px}.detail{padding:14px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.preview{height:170px}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="mark">✳</div><div><strong>Asset Manager</strong><small id="app">连接中…</small></div></div><div class="controls"><input class="version" id="version" value="1.0.0" aria-label="素材版本"><button class="secondary" id="refresh">刷新</button></div></header>
<div class="toolbar"><nav class="filters" id="filters" aria-label="素材类型"></nav><input id="search" class="search" type="search" placeholder="搜索素材名称或 ID" aria-label="搜索素材"></div>
<section class="upload"><div class="upload-heading"><strong id="upload-title">上传素材</strong><button type="button" id="upload-info" class="secondary info-button" aria-label="查看上传要求" title="查看上传要求">i</button></div><form id="upload-form"><input class="file" type="file" name="bundle" accept=".zip,application/zip" multiple required aria-label="选择多个素材包"><div class="upload-actions"><button id="upload-button">上传所选 ZIP</button></div></form></section>
<p id="status" class="notice" aria-live="polite"></p><section id="materials" class="grid" aria-live="polite"><div class="empty">正在读取素材…</div></section>
<section id="upload-guide" class="guide" role="dialog" aria-modal="true" aria-labelledby="guide-title"><div class="guide-panel"><div class="guide-head"><h2 id="guide-title">素材上传要求</h2><button id="close-guide" class="secondary">关闭</button></div><div class="guide-layout"><nav id="guide-nav" class="guide-nav" aria-label="上传文件目录"><div class="guide-nav-label">文件目录</div></nav><div class="guide-main" id="guide-main"><div id="guide-content"><p class="meta">正在读取协议要求…</p></div></div></div></div></section><section id="detail" class="detail"><div class="detail-head"><h2 id="detail-title">素材详情</h2><button id="close-detail" class="secondary">关闭</button></div><div id="detail-content"></div></section><footer class="foot" id="protocol"></footer>
</main><script>
const $=s=>document.querySelector(s),state={app:'',types:[],categories:[],items:[],category:'sticker',selected:null};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ver=()=>$('#version').value.trim()||'1.0.0';
async function api(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.details?.join('; ')||`HTTP ${r.status}`);return d}function msg(s,error=false){$('#status').textContent=s;$('#status').className='notice'+(error?' error':'')}
function categoryFor(type){return type==='sticker'||type==='sticker-pack'||type==='sticker-library'?'sticker':type==='animated-message-bubble'?'bubble':type==='fullscreen-animation'?'fullscreen':'general'}
function renderFilters(){const categories=state.categories.filter(c=>['sticker','bubble','fullscreen'].includes(c.id));if(!categories.some(c=>c.id===state.category))state.category=categories[0]?.id||'';$('#filters').innerHTML=categories.map(c=>`<button class="filter" data-filter="${esc(c.id)}" aria-pressed="${state.category===c.id}">${esc(c.label)}</button>`).join('');$('#filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.category=b.dataset.filter;renderFilters();renderItems();updateUploadLabel()});updateUploadLabel()}
function updateUploadLabel(){const category=state.categories.find(c=>c.id===state.category);$('#upload-button').textContent=category?`上传${category.label}`:'上传素材';$('#upload-title').textContent=category?`上传${category.label}`:'上传素材';$('#upload-form').elements.bundle.setAttribute('aria-label',category?`选择${category.label} ZIP`:'选择素材 ZIP')}
function renderItems(){const q=$('#search').value.trim().toLowerCase();let items=state.items.filter(x=>categoryFor(x.type)===state.category&&(!q||`${x.id} ${x.type} ${x.document?.name||''}`.toLowerCase().includes(q)));const root=$('#materials');if(!items.length){root.innerHTML='<div class="empty">没有匹配的素材</div>';return}root.innerHTML=items.map(x=>`<button class="material" data-id="${esc(x.id)}"><div class="preview"><span class="kind">${esc(x.type)}</span></div><div class="info"><p class="name">${esc(x.document?.name||x.document?.title||x.id)}</p><p class="meta">${esc(x.id)} · v${esc(x.contentVersion)}</p></div></button>`).join('');root.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(b.dataset.id))}
async function openDetail(id){try{const v=encodeURIComponent(ver()),base=`/api/v1/apps/${encodeURIComponent(state.app)}/versions/${v}`;const [item,manifest]=await Promise.all([api(`${base}/interactive-content/${encodeURIComponent(id)}`),api(`${base}/interactive-manifests/${encodeURIComponent(id)}`)]);state.selected=id;$('#detail-title').textContent=item.document?.name||item.document?.title||item.id;$('#detail-content').innerHTML=`<h3>文件（${manifest.files.length}）</h3>${manifest.files.map(f=>`<div class="file-row"><div><strong>${esc(f.fileName)}</strong><small>${esc(f.role||'')} · ${esc(f.mediaType)} · ${f.byteCount} bytes</small><small>assetID: ${esc(f.id)} · SHA-256: ${esc(f.sha256)}</small></div><a href="/api/v1/assets/${encodeURIComponent(f.id)}/download" target="_blank" rel="noreferrer">打开文件 ↗</a></div>`).join('')||'<p class="meta">该素材未引用独立文件。</p>'}<h3>协议配置 · ${esc(item.type)}</h3><pre class="json">${esc(JSON.stringify(item.document,null,2))}</pre><h3>文件清单</h3><pre class="json">${esc(JSON.stringify(manifest,null,2))}</pre>`;$('#detail').classList.add('open');$('#detail').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){msg(`无法读取素材详情：${e.message}`,true)}}
function humanizeKey(key){return key.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[-_]/g,' ').replace(/^./,c=>c.toUpperCase())}
function schemaFields(schema,depth=0){const props=schema?.properties||{};const required=new Set(schema?.required||[]);return Object.entries(props).map(([key,field])=>{const type=field.type||(field.enum?'enum':field.const!==undefined?'fixed value':field.$ref?'object':'value');const detail=field.description||([field.const!==undefined?`固定值：${field.const}`:null,field.enum?`可选值：${field.enum.join('、')}`:null,field.pattern?`格式：${field.pattern}`:null,field.minimum!==undefined?`最小值：${field.minimum}`:null,field.minLength!==undefined?`至少 ${field.minLength} 个字符`:null,field.items?`列表元素类型：${field.items.type||'按协议定义'}`:null].filter(Boolean).join('；'))||'按该字段的数据类型填写';const nested=field.properties?schemaFields(field,depth+1):field.items?.properties?schemaFields(field.items,depth+1):[];return `<div class="guide-field"><strong>${esc(humanizeKey(key))} <code>${esc(type)}</code> · ${required.has(key)?'必填':'按协议条件填写'}</strong><p>${esc(detail)}</p>${nested.length?`<div class="guide-nested">${nested.join('')}</div>`:''}</div>`}).join('')}
async function refresh(){try{msg('正在读取素材…');const [appInfo,protocol]=await Promise.all([api('/api/v1/app'),api('/api/v1/protocols/asset-server')]);state.app=appInfo.appId;state.categories=protocol.assetTypes||[];$('#app').textContent=state.app;const collection=await api(`/api/v1/apps/${encodeURIComponent(state.app)}/versions/${encodeURIComponent(ver())}/interactive-content`);state.items=collection.items||[];renderFilters();renderItems();msg('')}catch(e){msg(`无法加载素材分类：${e.message}`,true)}}
function renderGuideNav(){const nav=$('#guide-nav'),main=$('#guide-main');const sections=[...$('#guide-content').querySelectorAll('.guide-section[id]')];nav.innerHTML='<div class="guide-nav-label">文件目录</div>'+sections.map((section,i)=>`<button type="button" data-target="${esc(section.id)}" class="${i===0?'active':''}">${esc(section.dataset.navTitle||section.querySelector('h3')?.textContent||section.id)}<span class="nav-file">${esc(section.dataset.navFile||'协议说明')}</span></button>`).join('');nav.querySelectorAll('button[data-target]').forEach(button=>button.onclick=()=>{const target=document.getElementById(button.dataset.target);if(!target)return;main.scrollTo({top:target.offsetTop-main.offsetTop,behavior:'smooth'});nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button))})}
async function showUploadGuide(){const root=$('#guide-content');$('#upload-guide').classList.add('open');root.innerHTML='<p class="meta" style="padding:24px">正在读取当前分类的协议要求…</p>';$('#guide-nav').innerHTML='<div class="guide-nav-label">文件目录</div>';try{const registry=await api('/api/v1/protocols/interactive-assets');const category=state.categories.find(c=>c.id===state.category);const typesByCategory={};for(const type of registry.contentTypes||[]){const schemaUrl=registry.schemaFiles[type];if(!schemaUrl)continue;const schema=await api(schemaUrl);const categoryId=type==='sticker'||type==='sticker-pack'||type==='sticker-library'?'sticker':type==='animated-message-bubble'?'bubble':type==='fullscreen-animation'?'fullscreen':'general';(typesByCategory[categoryId]|| (typesByCategory[categoryId]=[])).push({type,schema})}const selected=typesByCategory[state.category]||[];const manifest=await api(registry.manifestSchema);const sections=[`<section class="guide-section" id="guide-package" data-nav-title="ZIP 包结构" data-nav-file="ZIP 文件"><h3>ZIP 包结构</h3><p>每个 ZIP 对应一份素材，需包含以下内容：</p><ul><li><code>content.json</code>：素材配置，字段要求按所选素材类型的协议定义。</li><li><code>asset-manifest.json</code>：素材文件清单，描述文件名、媒体类型、大小和 SHA-256。</li><li><code>files/</code>：清单中列出的全部文件；路径和清单必须一一对应。</li></ul><p>每个 ZIP 独立校验和发布。缺少文件、字段、引用或校验信息都会导致该包上传失败。</p></section>`,...selected.map((item,i)=>`<section class="guide-section" id="guide-schema-${i}" data-nav-title="${esc(item.schema.title||item.type)}" data-nav-file="content.json"><h3>${esc(item.schema.title||item.type)}</h3><p>对应配置文件：<code>content.json</code></p>${schemaFields(item.schema)||'<p>请遵循该素材类型的协议。</p>'}</section>`),`<section class="guide-section" id="guide-manifest" data-nav-title="文件清单" data-nav-file="asset-manifest.json"><h3>文件清单要求 · asset-manifest.json</h3>${schemaFields(manifest)||'<p>请遵循文件清单协议。</p>'}</section>`];root.innerHTML=sections.join('');$('#guide-main').scrollTop=0;renderGuideNav()}catch(e){root.innerHTML=`<p class="notice error" style="padding:24px">无法加载协议要求：${esc(e.message)}</p>`}}
$('#upload-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const files=[...form.elements.bundle.files];if(!files.length)return;const button=$('#upload-button');button.disabled=true;const results=[];try{for(let i=0;i<files.length;i++){msg(`正在校验并发布第 ${i+1}/${files.length} 个 ZIP：${files[i].name}`);const data=new FormData();data.append('bundle',files[i]);try{const result=await api(`/api/v1/apps/${encodeURIComponent(state.app)}/versions/${encodeURIComponent(ver())}/interactive-bundles?category=${encodeURIComponent(state.category)}`,{method:'POST',body:data});results.push({name:files[i].name,ok:true,id:result.id})}catch(err){results.push({name:files[i].name,ok:false,error:err.message})}}form.reset();await refresh();const success=results.filter(x=>x.ok).length;const failed=results.filter(x=>!x.ok);msg(`批量上传完成：成功 ${success}/${files.length}${failed.length?`；失败：${failed.map(x=>`${x.name}（${x.error}）`).join('；')}`:''}`,failed.length>0)}finally{button.disabled=false}};$('#upload-info').onclick=showUploadGuide;$('#close-guide').onclick=()=>$('#upload-guide').classList.remove('open');$('#upload-guide').onclick=e=>{if(e.target.id==='upload-guide')$('#upload-guide').classList.remove('open')};$('#refresh').onclick=refresh;$('#version').onchange=refresh;$('#search').oninput=renderItems;$('#close-detail').onclick=()=>$('#detail').classList.remove('open');refresh();
</script></body></html>
